[project]
name = "cite-or-die"
version = "1.1.1"
description = "Privacy-first RAG with verbatim-verified citations and tenant-isolated retrieval."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Abid Abdul-Gafoor" }]
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.162.4,<1.0.0",
  "uvicorn[standard]>=0.54.0,<1.0.0",
  "pydantic>=2.14.3,<3.0.0",
  "pydantic-settings>=2.16.2,<3.0.0",
  "httpx>=0.28.0,<0.29.0",
  "PyJWT==2.15.1",
  "typer>=0.29.0,<1.0.0",
  "rich>=15.0.0,<16.0.0",
  "qdrant-client>=1.20.0,<2.0.0",
  "rank-bm25>=0.2.2,<0.3.0",
  "pypdf==7.0.1",
  "python-docx>=1.1.2,<2.0.0",
  "prometheus-client>=0.26.0,<1.0.0",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk>=1.45.2,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0.0",
  "opentelemetry-exporter-otlp>=1.45.2,<2.0.0",
  "casbin>=1.40.0,<2.0.0",
  "presidio-analyzer>=2.2.366,<3.0.0",
  "presidio-anonymizer>=2.2.366,<3.0.0",
  "cryptography>=50.0.2,<51.0.0",
  "networkx>=3.4.0,<4.0.0",
  "starlette>=1.10.0,<2.0.0",
  "typing-extensions==4.16.0",
  "spacy==3.8.18",
]

[project.optional-dependencies]
local-models = [
  "sentence-transformers==6.2.0",
  "transformers==5.10.1",
]
dev = [
  "pytest>=9.2.0,<10.0.0",
  "pytest-asyncio>=1.4.1.post1,<2.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "httpx2>=2.16.0,<3.0.0",
  "hypothesis>=6.170.15,<7.0.0",
  "ruff>=0.17.4,<1.0.0",
  "pyrefly>=1.0.0,<2.0.0",
  "mypy>=1.13.0,<2.0.0",
  "locust>=2.47.0,<3.0.0",
  "reportlab>=5.1.0,<6.0.0",
  "types-reportlab==5.1.0.20261104",
  "types-networkx==3.6.1.20261108",
  "mutmut==3.8.1",
  "pip>=26.3,<27.0.0",
  "pip-audit>=2.10.1,<3.0.0",
  "cyclonedx-bom>=8.0.1,<9.0.0",
  "pytest-benchmark>=5.3.1,<6.0.0",
]

[project.scripts]
cite-or-die = "cite_or_die.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cite_or_die", "app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["B008", "S101", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
packages = ["cite_or_die"]

[tool.pyrefly]
preset = "strict"
check-unannotated-defs = true
project-includes = ["src/cite_or_die"]
search-path = ["src"]
python-version = "3.11.0"

[tool.importlinter]
root_packages = ["app", "cite_or_die", "scripts"]

[[tool.importlinter.contracts]]
name = "No sibling dependency cycles"
type = "acyclic_siblings"
ancestors = ["app", "app.**", "cite_or_die", "cite_or_die.**", "scripts", "scripts.**"]
depth = 0

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
