name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Prepare Python test dependencies
        run: uv sync --locked --all-extras
      - name: Prepare recording test dependencies
        working-directory: scripts/record_demo
        run: |
          bun install --frozen-lockfile
          bun x playwright install --with-deps chromium
          command -v ffmpeg
          command -v ffprobe
      - name: Verify native gates
        env:
          GH_TOKEN: ${{ github.token }}
          HE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .hooks/hard-eng.py check --base "$HE_BASE"
