name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type: ship it"
        required: true
      version:
        description: "Release version"
        required: true
        default: "1.1.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Python package and container
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'ship it' && inputs.version == '1.1.1' }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Exchange GitHub identity for a short-lived PyPI publishing token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: make release-check
      - run: make release-security
      - run: uv build
      - run: uv publish --trusted-publishing always
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            sgaabdu4/cite-or-die:1.1.1
            sgaabdu4/cite-or-die:latest
