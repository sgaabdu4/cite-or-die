name: Codex maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  maintain:
    permissions:
      contents: write
      issues: read
      pull-requests: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER_LOGIN: ${{ github.repository_owner }}
    steps:
      - name: Queue Dependabot pull requests
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          report="dependabot-report.md"
          : > "$report"
          default_branch=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
          if [ "$default_branch" != "main" ] && [ "$default_branch" != "master" ]; then
            echo "Skipped Dependabot merging because the default branch is $default_branch, not main or master." >> "$report"
            exit 0
          fi

          prs_text=$(gh api --paginate "/repos/$repo/pulls?state=open&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]") | .number')
          prs=()
          if [ -n "$prs_text" ]; then
            mapfile -t prs <<< "$prs_text"
          fi
          queued=0
          blocked=0
          {
            echo "### Dependabot pull requests"
            echo ""
            echo "Found ${#prs[@]} open Dependabot pull request(s)."
          } >> "$report"

          for pr in "${prs[@]}"; do
            title=$(gh pr view "$pr" --repo "$repo" --json title --jq .title)
            if output=$(gh pr merge "$pr" --repo "$repo" --auto --squash 2>&1); then
              queued=$((queued + 1))
              echo "- queued #$pr: $title" >> "$report"
            else
              blocked=$((blocked + 1))
              echo "- could not queue #$pr: $title" >> "$report"
              echo '```' >> "$report"
              echo "$output" >> "$report"
              echo '```' >> "$report"
            fi
          done

          {
            echo ""
            echo "Auto-merge requested: $queued"
            echo "Needs repository settings or another machine credential: $blocked"
          } >> "$report"

      - name: Record open issues not created by the owner
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          issues="issues-report.json"
          gh api --paginate "/repos/$repo/issues?state=open&per_page=100" \
            | jq -s --arg owner "$OWNER_LOGIN" '[add[]
                | select(.pull_request == null)
                | select(.user.login != $owner)
                | {number, title, author: .user.login, updated_at, url: .html_url}]' > "$issues"

          {
            echo "### Open issues not created by $OWNER_LOGIN"
            echo ""
            echo "Count: $(jq 'length' "$issues")"
            jq -r '.[0:50][] | "- #\(.number) \(.title) (@\(.author)) \(.url)"' "$issues"
          } >> dependabot-report.md

      - name: Email open issues not created by the owner
        shell: bash
        env:
          GMAIL_USERNAME: ${{ vars.CODEX_GMAIL_USERNAME }}
          GMAIL_TO: ${{ vars.CODEX_GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.CODEX_GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          count=$(jq 'length' issues-report.json)
          if [ "$count" -eq 0 ]; then
            echo "No open issues not created by $OWNER_LOGIN; no email sent." >> dependabot-report.md
            exit 0
          fi
          if [ -z "$GMAIL_USERNAME" ] || [ -z "$GMAIL_TO" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "Found $count open issue(s), but Gmail is not configured; no email sent." >> dependabot-report.md
            exit 0
          fi

          export REPORT_REPOSITORY="$GITHUB_REPOSITORY"
          export REPORT_OWNER="$OWNER_LOGIN"
          python3 - issues-report.json <<'PY'
          import json
          import os
          import smtplib
          import sys
          from email.message import EmailMessage

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              issues = json.load(handle)

          lines = [
              f"Open GitHub issues not created by {os.environ['REPORT_OWNER']}",
              f"Repository: {os.environ['REPORT_REPOSITORY']}",
              f"Count: {len(issues)}",
              "",
          ]
          for issue in issues:
              lines.append(
                  f"#{issue['number']} {issue['title']} (@{issue['author']}) {issue['url']}"
              )

          message = EmailMessage()
          message["Subject"] = (
              f"GitHub issues: {os.environ['REPORT_REPOSITORY']} ({len(issues)})"
          )
          message["From"] = os.environ["GMAIL_USERNAME"]
          message["To"] = os.environ["GMAIL_TO"]
          message.set_content("\n".join(lines))

          password = os.environ["GMAIL_APP_PASSWORD"].replace(" ", "")
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as smtp:
              smtp.ehlo()
              smtp.starttls()
              smtp.ehlo()
              smtp.login(os.environ["GMAIL_USERNAME"], password)
              smtp.send_message(message)
          PY
          echo "Emailed $count open issue(s) to $GMAIL_TO." >> dependabot-report.md

      - name: Publish maintenance report
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dependabot-report.md ]; then
            cat dependabot-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
