<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cite-or-die</title>
    <link rel="stylesheet" href="/static/tokens.css?v=ui-tokens" />
    <link rel="stylesheet" href="/static/styles.css?v=ui-tokens" />
    <link rel="stylesheet" href="/static/workspace.css?v=ui-tokens" />
    <link rel="stylesheet" href="/static/citation.css?v=ui-tokens" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">c/d</span>
          <h1>cite-or-die</h1>
        </div>

$workspace_controls
      </header>

$workspace_dialog

$provider_dialog

      <section class="workspace" id="workspace" aria-label="Document question workspace">
$source_panel

        <div
          id="sources-resizer"
          class="sources-resizer"
          role="separator"
          tabindex="0"
          aria-label="Resize sources panel"
          aria-orientation="vertical"
          aria-valuemin="220"
          aria-valuemax="560"
          aria-valuenow="286"
        ></div>

        <section class="chat-pane" aria-label="Chat">
          <div id="transcript" class="transcript" aria-live="polite">
            <p id="transcript-empty" class="transcript-empty">Set up the workspace, add a source, then ask a question.</p>
          </div>
$question_composer
        </section>
      </section>

$citation_viewer
    </main>

    <script type="module" src="/static/app.js?v=shared-controls"></script>
  </body>
</html>
