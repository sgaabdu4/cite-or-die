      <dialog id="workspace-setup-modal" class="setup-modal" aria-label="Workspace setup">
        <form id="workspace-setup-form" method="dialog">
          <header class="setup-modal-head">
            <div>
              <p class="workspace-kicker">Setup</p>
              <h2>Workspace</h2>
            </div>
            <button type="button" id="workspace-setup-close" class="ghost-button" aria-label="Close">
              Close
            </button>
          </header>

          <p class="setup-hint">
            Tenants separate provider credentials. Matters separate source documents and answers.
          </p>

          <div class="setup-grid">
            <fieldset class="setup-section">
              <legend>Scope</legend>
              <label>
                <span>Tenant</span>
                <input id="setup-tenant" autocomplete="off" />
              </label>
              <label>
                <span>Matter</span>
                <input id="setup-matter" autocomplete="off" />
              </label>
            </fieldset>

            <section class="setup-section" aria-label="Provider">
              <h3>Provider</h3>
              <p>Configure the model and retrieval stack for this tenant.</p>
              <button id="setup-provider" type="button" class="ghost-button">Provider settings</button>
            </section>

            <section class="setup-section" aria-label="Sources">
              <h3>Sources</h3>
              <p>Upload evidence and choose which files are allowed to answer.</p>
              <button id="setup-upload" type="button" class="ghost-button">Upload sources</button>
            </section>
          </div>

          <footer class="setup-modal-foot">
            <button type="submit" id="workspace-setup-save">Use workspace</button>
          </footer>
        </form>
      </dialog>
